name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/usb-smart-control.p12"

      - name: Build installable APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/usb-smart-control.p12
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/USB-Smart-Control.apk

      - name: Verify stable APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/USB-Smart-Control.apk

      - name: Verify modern Xposed metadata
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          unzip -l "$APK" | grep 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep 'META-INF/xposed/scope.list'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Smart-Control
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/debug/USB-Smart-Control.apk \
            --target "$GITHUB_SHA" \
            --title "USB 智能控制 ${VERSION} · ${SHORT_SHA}" \
            --notes "由 GitHub Actions 构建并验证。适用于 Android 8.0 及以上系统，需要支持现代 libxposed API 102 的 LSPosed 环境。" \
            --latest
